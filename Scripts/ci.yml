name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift & OS version
        run: |
          swift --version
          sw_vers

      - name: Run automated test suite
        run: swift run YeomanTests

      - name: Package release (.app, .dmg, .zip)
        run: ./Scripts/package_release.sh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yeoman-macOS-Build
          path: |
            dist/Yeoman.dmg
            dist/Yeoman.zip
